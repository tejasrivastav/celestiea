services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: celestiea
      POSTGRES_PASSWORD: celestiea
      POSTGRES_DB: celestiea
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U celestiea']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
