name: deploy

# Dev deploys on every push to main; prod only when started by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ inputs.env || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Both GitHub environments require a reviewer's approval before this job starts, and
    # the deploy role trusts only tokens issued for them.
    environment: ${{ inputs.env || 'dev' }}
    runs-on: ubuntu-24.04-arm
    env:
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.x
          terraform_wrapper: false
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - run: make deploy ENV=${{ inputs.env || 'dev' }} TF_APPLY_FLAGS=-auto-approve
