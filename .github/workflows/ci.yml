# Checks that need no AWS credentials. Deploys run from a laptop with make deploy.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celestiea
          POSTGRES_PASSWORD: celestiea
          POSTGRES_DB: celestiea
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U celestiea" --health-interval 2s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @celestiea/write-api package && pnpm --filter @celestiea/kill-switch package
      - run: pnpm --filter @celestiea/web build

  images:
    # Native arm64 runner: the images run on Graviton Fargate.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          for service in read-api migrator write-api; do
            docker buildx build -f app/services/$service/Dockerfile app
          done

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.x
      - uses: terraform-linters/setup-tflint@v4
      - run: terraform fmt -check -recursive
      - run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"
      - name: Validate roots
        run: for root in bootstrap envs/dev envs/prod; do terraform -chdir=$root init -backend=false -input=false && terraform -chdir=$root validate; done
      - name: Module tests (mocked providers, no AWS access)
        run: for module in database-aurora database-rds edge; do (cd modules/$module && terraform init -backend=false && terraform test); done
