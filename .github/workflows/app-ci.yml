name: app-ci

on:
  pull_request:
    paths: ['app/**', '.github/workflows/app-ci.yml']
  push:
    branches: [main]
    paths: ['app/**']

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celestiea
          POSTGRES_PASSWORD: celestiea
          POSTGRES_DB: celestiea
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U celestiea" --health-interval 2s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @celestiea/write-api package && pnpm --filter @celestiea/kill-switch package
      - run: pnpm --filter @celestiea/web build

  images:
    # Native arm64 runner: the images run on Graviton Fargate.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          for service in read-api migrator write-api; do
            docker buildx build -f app/services/$service/Dockerfile app
          done
